name: ISBF resume documents

on:
  pull_request:
    paths:
      - "plugins/isbf-resume/**"
      - ".github/workflows/isbf-resume.yml"
  push:
    branches:
      - main
    paths:
      - "plugins/isbf-resume/**"
      - ".github/workflows/isbf-resume.yml"

permissions:
  contents: read

concurrency:
  group: isbf-resume-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: plugins/isbf-resume/requirements.txt
      - name: Install local converters and fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-noto-cjk poppler-utils
      - name: Install pinned Python dependencies
        run: python -m pip install -r plugins/isbf-resume/requirements.txt
      - name: Check installation scripts
        run: bash -n plugins/isbf-resume/deploy/install-runtime.sh plugins/isbf-resume/deploy/install-plugin.sh
      - name: Verify mechanical documents
        working-directory: plugins/isbf-resume
        run: python -m unittest discover -s tests -v

  asset-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Install pinned asset regression dependencies
        run: |
          gem install propshaft --version 1.3.2 --no-document
          gem install minitest --version 6.0.6 --no-document
      - name: Verify production asset publication
        run: ruby plugins/isbf-resume/tests/publish_assets_test.rb
