name: ISBF activity levels and cosmetics

on:
  pull_request:
    paths:
      - "plugins/discourse-academy-roles/**"
      - "plugins/discourse-avatar-frames/**"
      - ".github/workflows/isbf-activity-levels.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isbf-activity-levels-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  native-regression:
    runs-on: ubuntu-latest
    container: discourse/discourse_test@sha256:94eca5318fed6171264b95204914de76a113c305cebb72d9fa9527e2c4496494
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      RAILS_ENV: test
      PGUSER: discourse
      PGPASSWORD: discourse
      LOAD_PLUGINS: "1"
      PARALLEL_TEST_PROCESSORS: "1"
      QUNIT_PARALLEL: "1"
      QUNIT_REUSE_BUILD: "1"
      NODE_OPTIONS: --max-old-space-size=2048
      CHEAP_SOURCE_MAPS: "1"
      EMBER_ENV: development
      PLAYWRIGHT_BROWSERS_PATH: /home/discourse/.cache/ms-playwright
      DBUS_SESSION_BUS_ADDRESS: unix:path=/dev/null

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare database services
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          redis-server /etc/redis/redis.conf --daemonize yes --logfile ""
          chown -R postgres /var/run/postgresql
          sudo -E -u postgres script/start_test_db.rb
          sudo -u postgres psql -c "CREATE ROLE discourse LOGIN SUPERUSER PASSWORD 'discourse';"

      - name: Install dependencies
        run: |
          ln -s /var/www/discourse/vendor/bundle vendor/bundle
          bundle config --local path vendor/bundle
          bundle config --local deployment true
          bundle config --local without ""
          bundle install --jobs 1
          pnpm install --frozen-lockfile

      - name: Prepare the synthetic database
        run: bin/rake db:create db:migrate

      - name: Activity configuration, evaluation, permissions and native badges
        run: |
          set -o pipefail
          mkdir -p tmp/isbf-activity-results
          bin/rspec \
            plugins/discourse-academy-roles/spec/lib/activity_levels \
            plugins/discourse-academy-roles/spec/services/activity_levels \
            plugins/discourse-academy-roles/spec/requests/activity_levels_controller_spec.rb \
            plugins/discourse-academy-roles/spec/requests/activity_cosmetics_spec.rb \
            plugins/discourse-avatar-frames/spec/models \
            plugins/discourse-avatar-frames/spec/services \
            plugins/discourse-avatar-frames/spec/requests \
            spec/services/badge_granter_spec.rb \
            | tee tmp/isbf-activity-results/backend.log

      - name: Build native frontend test assets
        run: |
          pnpm playwright-install
          script/assemble_ember_build.rb
          mkdir -p "$HOME/.pki/nssdb" "$HOME/.local/share/pki/nssdb"
          dbus-daemon --system --fork 2>/dev/null || true
          isbf_bus_address=$(dbus-daemon --session --fork --print-address 2>/dev/null)
          echo "DBUS_SESSION_BUS_ADDRESS=$isbf_bus_address" >> "$GITHUB_ENV"

      - name: Native level management and name preferences
        run: |
          set -o pipefail
          bin/qunit --standalone --target discourse-academy-roles \
            --filter '/Academy activity levels|Activity cosmetics/i' \
            | tee tmp/isbf-activity-results/academy-frontend.log

      - name: Native frame editor and preferences
        run: |
          set -o pipefail
          bin/qunit --standalone --target discourse-avatar-frames \
            --filter 'Activity cosmetics' \
            | tee tmp/isbf-activity-results/frames-frontend.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: isbf-activity-levels-${{ github.run_id }}
          path: |
            tmp/isbf-activity-results/
            tmp/capybara/
          if-no-files-found: warn
          retention-days: 14
