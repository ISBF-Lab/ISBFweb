name: ISBF guides

on:
  pull_request:
    paths:
      - "plugins/isbf-guides/**"
      - ".github/workflows/isbf-guides.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isbf-guides-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  plugins:
    runs-on: ubuntu-latest
    container: discourse/discourse_test@sha256:94eca5318fed6171264b95204914de76a113c305cebb72d9fa9527e2c4496494
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      RAILS_ENV: test
      PGUSER: discourse
      PGPASSWORD: discourse
      LOAD_PLUGINS: "1"
      PARALLEL_TEST_PROCESSORS: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare database services
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          redis-server /etc/redis/redis.conf --daemonize yes --logfile ""
          chown -R postgres /var/run/postgresql
          sudo -E -u postgres script/start_test_db.rb
          sudo -u postgres psql -c "CREATE ROLE discourse LOGIN SUPERUSER PASSWORD 'discourse';"

      - name: Install dependencies
        run: |
          ln -s /var/www/discourse/vendor/bundle vendor/bundle
          bundle config --local path vendor/bundle
          bundle config --local deployment true
          bundle config --local without development
          bundle install --jobs 1
          pnpm install --frozen-lockfile

      - name: Prepare the synthetic test database
        run: bin/rake db:create db:migrate

      - name: Guide imports, private media and publication lifecycle
        run: |
          mkdir -p tmp
          set -o pipefail
          bin/rspec plugins/isbf-guides/spec | tee tmp/isbf-guides-rspec.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: isbf-guides-results-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: tmp/isbf-guides-rspec.log
