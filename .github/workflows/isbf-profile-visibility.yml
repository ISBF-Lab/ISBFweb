name: ISBF profile visibility

on:
  pull_request:
    paths:
      - "plugins/isbf-profile-visibility/**"
      - "plugins/discourse-topic-voting/**"
      - "plugins/discourse-solved/**"
      - "plugins/discourse-reactions/**"
      - "plugins/isbf-anonymous/**"
      - "lib/guardian/user_guardian.rb"
      - "app/serializers/user_card_serializer.rb"
      - "app/serializers/user_serializer.rb"
      - "app/controllers/users_controller.rb"
      - "app/controllers/list_controller.rb"
      - "app/controllers/posts_controller.rb"
      - "lib/oneboxer.rb"
      - "lib/discourse_mcp/tools/users.rb"
      - ".github/workflows/isbf-profile-visibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isbf-profile-visibility-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  plugins:
    runs-on: ubuntu-latest
    container: discourse/discourse_test@sha256:94eca5318fed6171264b95204914de76a113c305cebb72d9fa9527e2c4496494
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      RAILS_ENV: test
      PGUSER: discourse
      PGPASSWORD: discourse
      LOAD_PLUGINS: "1"
      PARALLEL_TEST_PROCESSORS: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare database services
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          redis-server /etc/redis/redis.conf --daemonize yes --logfile ""
          chown -R postgres /var/run/postgresql
          sudo -E -u postgres script/start_test_db.rb
          sudo -u postgres psql -c "CREATE ROLE discourse LOGIN SUPERUSER PASSWORD 'discourse';"

      - name: Install dependencies
        run: |
          ln -s /var/www/discourse/vendor/bundle vendor/bundle
          bundle config --local path vendor/bundle
          bundle config --local deployment true
          bundle config --local without development
          bundle install --jobs 1
          pnpm install --frozen-lockfile

      - name: Prepare the synthetic test database
        run: bin/rake db:create db:migrate

      - name: Profile visibility and the activity lists it closes
        run: |
          mkdir -p tmp
          set -o pipefail
          bin/rspec \
            plugins/isbf-profile-visibility/spec \
            plugins/discourse-topic-voting/spec/requests/lists_controller_spec.rb \
            plugins/discourse-solved/spec/requests/solved_topics_controller_spec.rb \
            plugins/discourse-reactions/spec/requests/custom_reactions_controller_spec.rb \
            plugins/isbf-anonymous/spec \
            | tee tmp/isbf-profile-visibility-rspec.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: isbf-profile-visibility-results-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: tmp/isbf-profile-visibility-rspec.log

  qunit:
    runs-on: ubuntu-latest
    container: discourse/discourse_test@sha256:94eca5318fed6171264b95204914de76a113c305cebb72d9fa9527e2c4496494
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RAILS_ENV: test
      PGUSER: discourse
      PGPASSWORD: discourse
      LOAD_PLUGINS: "1"
      QUNIT_PARALLEL: "1"
      QUNIT_REUSE_BUILD: "1"
      NODE_OPTIONS: --max-old-space-size=2048
      CHEAP_SOURCE_MAPS: "1"
      EMBER_ENV: development
      PLAYWRIGHT_BROWSERS_PATH: /home/discourse/.cache/ms-playwright
      DBUS_SESSION_BUS_ADDRESS: unix:path=/dev/null

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare database services
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          redis-server /etc/redis/redis.conf --daemonize yes --logfile ""
          chown -R postgres /var/run/postgresql
          sudo -E -u postgres script/start_test_db.rb
          sudo -u postgres psql -c "CREATE ROLE discourse LOGIN SUPERUSER PASSWORD 'discourse';"

      - name: Install dependencies
        run: |
          ln -s /var/www/discourse/vendor/bundle vendor/bundle
          bundle config --local path vendor/bundle
          bundle config --local deployment true
          bundle config --local without ""
          bundle install --jobs 1
          pnpm install --frozen-lockfile
          pnpm playwright-install

      - name: Prepare test database and assets
        run: |
          bin/rake db:create db:migrate
          script/assemble_ember_build.rb
          mkdir -p "$HOME/.pki/nssdb" "$HOME/.local/share/pki/nssdb"
          dbus-daemon --system --fork 2>/dev/null || true
          isbf_bus_address=$(dbus-daemon --session --fork --print-address 2>/dev/null)
          echo "DBUS_SESSION_BUS_ADDRESS=$isbf_bus_address" >> "$GITHUB_ENV"

      - name: Preferences, tabs, fallbacks and placeholders
        run: |
          mkdir -p tmp
          set -o pipefail
          bin/qunit --standalone plugins/isbf-profile-visibility/test/javascripts/acceptance/profile-visibility-test.js | tee tmp/isbf-profile-visibility-qunit.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: isbf-profile-visibility-qunit-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: tmp/isbf-profile-visibility-qunit.log
