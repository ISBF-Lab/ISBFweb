brand_show_logo:
  default: true
  type: bool
  description: "显示徽标：使用后台「徽标」页配置的对应场景图片及深色版本。"

brand_show_name:
  default: true
  type: bool
  description: "显示名称：显示平台名称，可与徽标同时显示；两个开关均关闭时隐藏品牌区域。"

brand_name:
  default: "国金综合平台"
  type: string
  description: "导航中显示的平台名称。"

official_path:
  default: "/c/official/6/l/latest"
  type: string
  description: "官方信息标签使用的现有 Discourse 分类列表路由。"

show_right_rail:
  default: true
  type: bool
  description: "宽屏显示搜索与热门话题入口。"

calendar_category_id:
  default: 0
  type: integer
  description: "校园活动分类 ID；日历仅展示该分类的活动。"

feedback_category_id:
  default: 2
  type: integer
  description: "更多菜单使用的现有反馈分类 ID；该分类复用首页信息流和发布框，保留原生权限。"

join_us_description:
  default: ""
  type: string
  description: "加入我们弹窗的招募说明、岗位及联系方式。留空时显示招募信息筹备中；仅作为纯文本显示。"

calendar_category_path:
  default: "/c/campus-events"
  type: string
  description: "校园活动分类页面路径，用于发布活动入口。"

svg_icons:
  default: "bag-shopping"
  type: list
  list_type: compact
  description: "商城工作台入口使用的图标。"

workbench_layout_mobile:
  default: traditional
  type: enum
  choices:
    - traditional
    - glass
  refresh: true
  description:
    zh_CN: "手机工作台布局，统一对全站用户生效，与电脑布局独立。传统布局使用原来的平面入口；玻璃布局使用紧凑液态玻璃入口。"
    en: "Mobile workbench layout for everyone, independent of desktop. Choose the original flat entries or compact liquid glass."

workbench_layout_desktop:
  default: glass
  type: enum
  choices:
    - traditional
    - glass
  refresh: true
  description:
    zh_CN: "电脑工作台布局，统一对全站用户生效，与手机布局独立。玻璃布局使用下方明暗配色；传统布局沿用原来配色。"
    en: "Desktop workbench layout for everyone, independent of mobile. Glass uses the color settings below; traditional retains the original palette."

workbench_panel_color_light:
  default: ""
  type: string
  max: 7
  refresh: true
  description:
    zh_CN: "电脑工作台：工具箱底板（浅色模式），填写 #RRGGBB。留空跟随主题；单模块设置可覆盖默认颜色。仅影响电脑，不改变手机旧版配色。"
    en: "Desktop workbench: Toolbox background (light mode). Enter #RRGGBB; leave blank to inherit the default/theme. Does not change mobile colors."

