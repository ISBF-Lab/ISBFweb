brand_show_logo:
  default: true
  type: bool
  description: "显示徽标：使用后台「徽标」页配置的对应场景图片及深色版本。"

brand_show_name:
  default: true
  type: bool
  description: "显示名称：显示平台名称，可与徽标同时显示；两个开关均关闭时隐藏品牌区域。"

brand_name:
  default: "国金综合平台"
  type: string
  description: "导航中显示的平台名称。"

official_path:
  default: "/c/official/6/l/latest"
  type: string
  description: "官方信息标签使用的现有 Discourse 分类列表路由。"

show_right_rail:
  default: true
  type: bool
  description: "宽屏显示搜索与热门话题入口。"

calendar_category_id:
  default: 0
  type: integer
  description: "校园活动分类 ID；日历仅展示该分类的活动。"

feedback_category_id:
  default: 2
  type: integer
  description: "更多菜单使用的现有反馈分类 ID；该分类复用首页信息流和发布框，保留原生权限。"

join_us_description:
  default: ""
  type: string
  description: "加入我们弹窗的招募说明、岗位及联系方式。留空时显示招募信息筹备中；仅作为纯文本显示。"

calendar_category_path:
  default: "/c/campus-events"
  type: string
  description: "校园活动分类页面路径，用于发布活动入口。"

svg_icons:
  default: "bag-shopping"
  type: list
  list_type: compact
  description: "商城工作台入口使用的图标。"

workbench_entries:
  type: objects
  refresh: true
  default:
    - key: learning_resources
      icon: ""
      tone: default
    - key: library
      icon: ""
      tone: default
    - key: courses
      icon: ""
      tone: default
    - key: careers
      icon: ""
      tone: default
    - key: resume
      icon: ""
      tone: default
    - key: campus_services
      icon: ""
      tone: default
    - key: student_identity
      icon: ""
      tone: default
    - key: alumni
      icon: ""
      tone: default
    - key: marketplace
      icon: ""
      tone: default
    - key: teamup
      icon: ""
      tone: default
    - key: mbti
      icon: ""
      tone: default
    - key: ai_assistant
      icon: ""
      tone: default
    - key: guides
      icon: ""
      tone: default
  schema:
    name: workbench entry
    identifier: key
    properties:
      key:
        type: enum
        required: true
        choices:
          - learning_resources
          - library
          - courses
          - careers
          - resume
          - campus_services
          - student_identity
          - alumni
          - marketplace
          - teamup
          - mbti
          - ai_assistant
          - guides
      icon:
        type: icon
      tone:
        type: enum
        default: default
        choices:
          - default
          - theme
          - mint
          - amber
          - violet
  description:
    zh_CN: "工作台入口：使用上下移动按钮排序，选择内置图标和预设色板。手机与电脑共用此配置，保存后刷新工作台生效。清空图标或使用默认色板可恢复原有显示；关闭的功能保留配置，重新开启后恢复位置。遗漏入口按原顺序补到末尾，重复标识取第一项，未知标识忽略。名称、链接和权限由原业务提供。"
    en: "Workbench entries: use the move buttons to reorder entries, then choose built-in icons and preset palettes. Mobile and desktop share this configuration; save and refresh the workbench to apply it. Clear an icon or select the default palette to restore the original appearance. Disabled features retain their configuration and position. Missing entries are appended in the original order; the first duplicate key wins and unknown keys are ignored. Names, links, and permissions remain controlled by each feature."

workbench_layout_mobile:
  default: traditional
  type: enum
  choices:
    - traditional
    - glass
  refresh: true
  description:
    zh_CN: "手机工作台布局，统一对全站用户生效，与电脑布局独立。传统布局使用原来的平面入口；玻璃布局使用紧凑液态玻璃入口。"
    en: "Mobile workbench layout for everyone, independent of desktop. Choose the original flat entries or compact liquid glass."

workbench_layout_desktop:
  default: glass
  type: enum
  choices:
    - traditional
    - glass
  refresh: true
  description:
    zh_CN: "电脑工作台布局，统一对全站用户生效，与手机布局独立。玻璃布局使用下方明暗配色；传统布局沿用原来配色。"
    en: "Desktop workbench layout for everyone, independent of mobile. Glass uses the color settings below; traditional retains the original palette."

workbench_panel_color_light:
  default: ""
  type: string
  max: 7
  refresh: true
  description:
    zh_CN: "电脑工作台：工具箱底板（浅色模式），填写 #RRGGBB。留空跟随主题；单模块设置可覆盖默认颜色。仅影响电脑，不改变手机旧版配色。"
    en: "Desktop workbench: Toolbox background (light mode). Enter #RRGGBB; leave blank to inherit the default/theme. Does not change mobile colors."

