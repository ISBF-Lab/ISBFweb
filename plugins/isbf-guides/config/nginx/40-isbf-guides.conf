# Forward Guides to the authenticated application, including image requests.
# Headers match the running site's @discourse handler captured on 2026-11-04.
# Apply to both the persistent Guides configuration and the runtime include.

location = /guides {
  expires off;
  proxy_no_cache 1;
  proxy_cache_bypass 1;
  proxy_hide_header Cache-Control;
  add_header Cache-Control "private, no-store" always;
  include conf.d/outlets/discourse/*.conf;
  proxy_set_header Host $http_host;
  proxy_set_header X-Request-Start "t=${msec}";
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $thescheme;
  proxy_set_header X-Sendfile-Type "";
  proxy_set_header X-Accel-Mapping "";
  proxy_set_header Client-Ip "";
  proxy_pass http://discourse;
}

