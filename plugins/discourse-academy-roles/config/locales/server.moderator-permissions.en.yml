en:
  site_settings:
    academy_activity_category: "Category for campus activities. Moderators need the activity publishing permission to create topics here."
    academy_moderators_access_internal_boards: "Allow moderators to access staff-only categories and group messages."
    academy_moderators_access_user_admin: "Allow moderators to open user administration information. Student numbers and IP addresses remain restricted to developers."
    academy_moderators_view_hidden_content: "Allow moderators to view hidden, deleted and staff-only posts in categories they can access."
    academy_moderators_review_content: "Allow moderators to review ordinary content. Account penalties and content changes require their own permissions."
    academy_moderators_edit_others_content: "Allow moderators to edit other members’ posts. Learning resources require the separate resource management permission."
    academy_moderators_delete_others_content: "Allow moderators to delete and restore ordinary posts and topics they can access."
    academy_moderators_manage_topics: "Allow moderators to close, pin, move, split and merge ordinary topics they can access."
    academy_moderators_edit_users: "Allow moderators to edit ordinary accounts. Management identities, trust levels and credentials remain restricted."
    academy_moderators_suspend_users: "Allow moderators to suspend and unsuspend ordinary accounts."
    academy_moderators_silence_users: "Allow moderators to silence and unsilence ordinary accounts, including review actions."
    academy_moderators_delete_users: "Allow moderators to delete ordinary accounts subject to the existing deletion limits."
    academy_moderators_anonymize_users: "Allow moderators to anonymize ordinary accounts."
    academy_moderators_publish_activities: "Allow moderators to publish topics in the configured campus activity category."
    academy_moderators_publish_official: "Allow moderators to publish with the official identity in the configured official category."
    academy_moderators_review_resources: "Allow moderators to review learning resources and course requests. Direct publishing and resource changes require resource management."
    academy_moderators_review_resumes: "Allow moderators to review shared resumes, revise descriptions and view review history. Disabled by default; only developers can review while disabled."
    academy_moderators_review_alumni: "Allow moderators to review alumni applications and their private proof files. Does not grant user management or general email access."
    academy_moderators_manage_resources: "Allow moderators to publish, edit, delete and restore learning resources."
    academy_moderators_trace_anonymous: "Allow moderators to look up anonymous authors only for content they can access."
