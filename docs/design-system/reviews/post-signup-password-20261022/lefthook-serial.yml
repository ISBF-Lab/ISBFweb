{
  "output": [
    "summary",
    "empty_summary",
    "failure",
    "execution",
    "execution_out",
    "execution_info",
    "skips"
  ],
  "glob_matcher": "doublestar",
  "pre-commit": {
    "parallel": false,
    "skip": [
      "merge",
      "rebase"
    ],
    "commands": {
      "rubocop": {
        "exclude": [
          "bin/dev",
          "bin/notify_file_change",
          "bin/system_rspec",
          "bin/docker/**/*"
        ],
        "glob": [
          "**/*.{rb,rake,thor}",
          "bin/**/*",
          "Gemfile"
        ],
        "run": "env -u BUNDLE_PATH -u BUNDLE_WITHOUT BUNDLE_GEMFILE=/tools/lint.Gemfile BUNDLE_PATH__SYSTEM=true /lint-gems/bin/rubocop --force-exclusion {staged_files}"
      },
      "syntax_tree": {
        "exclude": [
          "bin/dev",
          "bin/notify_file_change",
          "bin/system_rspec",
          "bin/docker/**/*"
        ],
        "glob": [
          "**/*.{rb,rake,thor}",
          "bin/**/*",
          "Gemfile"
        ],
        "run": "/lint-gems/bin/stree check Gemfile {staged_files}"
      },
      "prettier": {
        "glob": [
          "app/assets/stylesheets/**/*.{css,scss}",
          "frontend/**/*.{js,gjs,ts,gts,mts,cts,scss,css,cjs,mjs}",
          "plugins/**/*.{js,gjs,ts,gts,mts,cts,scss,css,cjs,mjs}",
          "themes/**/*.{js,gjs,ts,gts,mts,cts,scss,css,cjs,mjs}"
        ],
        "run": "pnpm pprettier --list-different {staged_files}"
      },
      "developer-docs-prettier": {
        "root": "docs/developer-guides/",
        "glob": "docs/developer-guides/**/*.{md,json,mjs,yml}",
        "run": "pnpm prettier --list-different {staged_files}"
      },
      "eslint": {
        "glob": [
          "frontend/**/*.{js,gjs,ts,gts,mts,cts,cjs,mjs}",
          "plugins/**/*.{js,gjs,ts,gts,mts,cts,cjs,mjs}",
          "themes/**/*.{js,gjs,ts,gts,mts,cts,cjs,mjs}"
        ],
        "run": "pnpm eslint --max-warnings 0 --no-warn-ignored {staged_files}"
      },
      "yaml-syntax": {
        "glob": "**/*.{yaml,yml}",
        "exclude": "config/database.yml",
        "run": "/lint-gems/bin/yaml-lint {staged_files}"
      },
      "i18n-lint": {
        "glob": "**/{client,server}.en.yml",
        "run": "env GEM_PATH=/lint-gems:/var/www/discourse/vendor/bundle/ruby/3.4.0:/usr/local/lib/ruby/gems/3.4.0 ruby script/i18n_lint.rb {staged_files}"
      },
      "stylelint": {
        "glob": [
          "app/assets/stylesheets/**/*.scss",
          "plugins/**/assets/stylesheets/**/*.scss",
          "themes/**/*.scss"
        ],
        "run": "pnpm stylelint {staged_files}"
      }
    }
  },
  "fix-staged": {
    "parallel": false,
    "commands": {
      "prettier": {
        "glob": [
          "app/assets/stylesheets/**/*.{css,scss}",
          "frontend/**/*.{js,gjs,ts,gts,mts,cts,scss,css,cjs,mjs}",
          "plugins/**/*.{js,gjs,ts,gts,mts,cts,scss,css,cjs,mjs}",
          "themes/**/*.{js,gjs,ts,gts,mts,cts,scss,css,cjs,mjs}"
        ],
        "run": "pnpm pprettier --write {staged_files}"
      },
      "developer-docs-prettier": {
        "root": "docs/developer-guides/",
        "glob": "docs/developer-guides/**/*.{md,json,mjs,yml}",
        "run": "pnpm prettier --write {staged_files}"
      },
      "eslint": {
        "glob": [
          "frontend/**/*.{js,gjs,ts,gts,mts,cts,cjs,mjs}",
          "plugins/**/*.{js,gjs,ts,gts,mts,cts,cjs,mjs}",
          "themes/**/*.{js,gjs,ts,gts,mts,cts,cjs,mjs}"
        ],
        "run": "pnpm eslint --fix --no-warn-ignored {staged_files}"
      },
      "stylelint": {
        "glob": [
          "app/assets/stylesheets/**/*.scss",
          "plugins/**/assets/stylesheets/**/*.scss",
          "themes/**/*.scss"
        ],
        "run": "pnpm stylelint --fix {staged_files}"
      },
      "rubocop": {
        "exclude": [
          "bin/dev",
          "bin/notify_file_change",
          "bin/system_rspec",
          "bin/docker/**/*"
        ],
        "glob": [
          "**/*.{rb,rake,thor}",
          "bin/**/*",
          "Gemfile"
        ],
        "run": "bundle exec rubocop --force-exclusion -A {staged_files}"
      },
      "syntax_tree": {
        "exclude": [
          "bin/dev",
          "bin/notify_file_change",
          "bin/system_rspec",
          "bin/docker/**/*"
        ],
        "glob": [
          "**/*.{rb,rake,thor}",
          "bin/**/*",
          "Gemfile"
        ],
        "run": "bundle exec stree write Gemfile {staged_files}"
      }
    }
  },
  "lint-files": {
    "parallel": false,
    "commands": {
      "rubocop": {
        "files": "git ls-files --cached --others --exclude-standard",
        "exclude": [
          "bin/dev",
          "bin/notify_file_change",
          "bin/system_rspec",
          "bin/docker/**/*"
        ],
        "glob": [
          "**/*.{rb,rake,thor}",
          "bin/**/*",
          "Gemfile"
        ],
        "run": "env -u BUNDLE_PATH -u BUNDLE_WITHOUT BUNDLE_GEMFILE=/tools/lint.Gemfile BUNDLE_PATH__SYSTEM=true /lint-gems/bin/rubocop --force-exclusion {files}"
      },
      "syntax_tree": {
        "files": "git ls-files --cached --others --exclude-standard",
        "exclude": [
          "bin/dev",
          "bin/notify_file_change",
          "bin/system_rspec",
          "bin/docker/**/*"
        ],
        "glob": [
          "**/*.{rb,rake,thor}",
          "bin/**/*",
          "Gemfile"
        ],
        "run": "/lint-gems/bin/stree check Gemfile {files}"
      },
      "prettier": {
        "files": "git ls-files --cached --others --exclude-standard",
        "glob": [
          "app/assets/stylesheets/**/*.{css,scss}",
          "frontend/**/*.{js,gjs,ts,gts,mts,cts,scss,css,cjs,mjs}",
          "plugins/**/*.{js,gjs,ts,gts,mts,cts,scss,css,cjs,mjs}",
          "themes/**/*.{js,gjs,ts,gts,mts,cts,scss,css,cjs,mjs}",
          "script/**/*.{js,mjs}"
        ],
        "run": "pnpm pprettier --list-different {files}"
      },
      "developer-docs-prettier": {
        "files": "git ls-files --cached --others --exclude-standard",
        "root": "docs/developer-guides/",
        "glob": "docs/developer-guides/**/*.{md,json,mjs,yml}",
        "run": "pnpm prettier --list-different {files}"
      },
      "eslint": {
        "files": "git ls-files --cached --others --exclude-standard",
        "glob": [
          "frontend/**/*.{js,gjs,ts,gts,mts,cts,cjs,mjs}",
          "plugins/**/*.{js,gjs,ts,gts,mts,cts,cjs,mjs}",
          "themes/**/*.{js,gjs,ts,gts,mts,cts,cjs,mjs}",
          "script/**/*.{js,mjs}"
        ],
        "run": "pnpm eslint --max-warnings 0 --no-warn-ignored {files}"
      },
      "yaml-syntax": {
        "files": "git ls-files --cached --others --exclude-standard",
        "glob": "**/*.{yaml,yml}",
        "exclude": "config/database.yml",
        "run": "/lint-gems/bin/yaml-lint {files}"
      },
      "i18n-lint": {
        "files": "git ls-files --cached --others --exclude-standard",
        "glob": "**/{client,server}.en.yml",
        "run": "env GEM_PATH=/lint-gems:/var/www/discourse/vendor/bundle/ruby/3.4.0:/usr/local/lib/ruby/gems/3.4.0 ruby script/i18n_lint.rb {files}"
      },
      "stylelint": {
        "files": "git ls-files --cached --others --exclude-standard",
        "glob": [
          "app/assets/stylesheets/**/*.scss",
          "plugins/**/assets/stylesheets/**/*.scss",
          "themes/**/*.scss"
        ],
        "run": "pnpm stylelint {files}"
      }
    }
  },
  "fix-files": {
    "parallel": false,
    "commands": {
      "prettier": {
        "files": "git ls-files --cached --others --exclude-standard",
        "glob": [
          "app/assets/stylesheets/**/*.{css,scss}",
          "frontend/**/*.{js,gjs,ts,gts,mts,cts,scss,css,cjs,mjs}",
          "plugins/**/*.{js,gjs,ts,gts,mts,cts,scss,css,cjs,mjs}",
          "themes/**/*.{js,gjs,ts,gts,mts,cts,scss,css,cjs,mjs}",
          "script/**/*.{js,mjs}",
          "package.json",
          "docs/design-system/dialog-exceptions.json"
        ],
        "run": "pnpm pprettier --write {files}"
      },
      "developer-docs-prettier": {
        "files": "git ls-files --cached --others --exclude-standard",
        "root": "docs/developer-guides/",
        "glob": "docs/developer-guides/**/*.{md,json,mjs,yml}",
        "run": "pnpm prettier --write {files}"
      },
      "eslint": {
        "files": "git ls-files --cached --others --exclude-standard",
        "glob": [
          "frontend/**/*.{js,gjs,ts,gts,mts,cts,cjs,mjs}",
          "plugins/**/*.{js,gjs,ts,gts,mts,cts,cjs,mjs}",
          "themes/**/*.{js,gjs,ts,gts,mts,cts,cjs,mjs}",
          "script/**/*.{js,mjs}"
        ],
        "run": "pnpm eslint --fix {files}"
      },
      "stylelint": {
        "files": "git ls-files --cached --others --exclude-standard",
        "glob": [
          "app/assets/stylesheets/**/*.scss",
          "plugins/**/assets/stylesheets/**/*.scss",
          "themes/**/*.scss"
        ],
        "run": "pnpm stylelint --fix {files}"
      },
      "rubocop": {
        "files": "git ls-files --cached --others --exclude-standard",
        "exclude": [
          "bin/dev",
          "bin/notify_file_change",
          "bin/system_rspec",
          "bin/docker/**/*"
        ],
        "glob": [
          "**/*.{rb,rake,thor}",
          "bin/**/*",
          "Gemfile"
        ],
        "run": "env -u BUNDLE_PATH -u BUNDLE_WITHOUT BUNDLE_GEMFILE=/tools/lint.Gemfile BUNDLE_PATH__SYSTEM=true /lint-gems/bin/rubocop --force-exclusion -A {files}"
      },
      "syntax_tree": {
        "files": "git ls-files --cached --others --exclude-standard",
        "exclude": [
          "bin/dev",
          "bin/notify_file_change",
          "bin/system_rspec",
          "bin/docker/**/*"
        ],
        "glob": [
          "**/*.{rb,rake,thor}",
          "bin/**/*",
          "Gemfile"
        ],
        "run": "/lint-gems/bin/stree write Gemfile {files}"
      }
    }
  },
  "fix-all": {
    "parallel": false,
    "commands": {
      "prettier": {
        "run": "pnpm lint:prettier:fix"
      },
      "eslint": {
        "run": "pnpm lint:js:fix"
      },
      "stylelint": {
        "run": "pnpm lint:css:fix"
      },
      "rubocop": {
        "run": "bundle exec rubocop --force-exclusion -A"
      },
      "syntax_tree": {
        "exclude": [
          "bin/dev",
          "bin/notify_file_change",
          "bin/system_rspec",
          "bin/docker/**/*"
        ],
        "glob": [
          "**/*.{rb,rake,thor}",
          "bin/**/*",
          "Gemfile"
        ],
        "run": "bundle exec stree write Gemfile {all_files}"
      }
    }
  },
  "lints": {
    "parallel": true,
    "commands": {
      "rubocop": {
        "glob": [
          "**/*.{rb,rake,thor}",
          "bin/**/*",
          "Gemfile"
        ],
        "run": "bundle exec rubocop"
      },
      "syntax_tree": {
        "exclude": [
          "bin/dev",
          "bin/notify_file_change",
          "bin/system_rspec",
          "bin/docker/**/*"
        ],
        "glob": [
          "**/*.{rb,rake,thor}",
          "bin/**/*",
          "Gemfile"
        ],
        "run": "bundle exec stree check Gemfile {all_files}"
      },
      "prettier": {
        "run": "pnpm lint:prettier"
      },
      "eslint": {
        "run": "pnpm lint:js"
      },
      "stylelint": {
        "run": "pnpm lint:css"
      },
      "yaml-syntax": {
        "glob": "**/*.{yaml,yml}",
        "exclude": "config/database.yml",
        "run": "bundle exec yaml-lint {all_files}"
      },
      "i18n-lint": {
        "glob": "**/{client,server}.en.yml",
        "run": "env GEM_PATH=/lint-gems:/var/www/discourse/vendor/bundle/ruby/3.4.0:/usr/local/lib/ruby/gems/3.4.0 ruby script/i18n_lint.rb {all_files}"
      },
      "glint": {
        "run": "pnpm lint:types"
      }
    }
  }
}
