    if (this.#failedRequest === "previous") {
      return this.loadPrevious();
    }
    return this.#failedRequest === "next"
      ? this.loadMore()
      : this.loadChildren();
  }

  #mergeNodes(nodes) {
    return [...this.childNodes, ...nodes]
      .filter(
        (node, index, all) =>
          all.findIndex((item) => item.post.id === node.post.id) === index
      )
      .sort((left, right) => left.post.post_number - right.post.post_number);
  }

  _cacheKeyFor(
    parentPostNumber = this.args.parentPostNumber,
    topicId = this.args.topic?.id
  ) {
    return `${topicId}:${parentPostNumber}`;
  }

  _hydrateFromArgs() {
    if (this._identityKey === this.identityKey) {
      return;
    }

    this._identityKey = this.identityKey;
    this._activeCacheKey = this._cacheKeyFor();
    this.childNodes = [];
    this.loading = false;
    this.page = 0;
    this.hasMore = false;
    this.loadingMore = false;
    this.loaded = false;
    this._fetchedFromServer = false;
    this.error = false;
    this.previousPage = 0;
    this.loadingPrevious = false;
    this.#failedRequest = null;

    const cached = this.args.fetchedChildrenCache?.get(this._activeCacheKey);

  _reportToCache(cacheKey = this._activeCacheKey) {
    if (!this.loaded || !cacheKey || !this.args.fetchedChildrenCache) {
      return;
    }
    this.args.fetchedChildrenCache.set(cacheKey, {
      childNodes: this.childNodes,
      page: this.page,
      hasMore: this.hasMore,
      fetchedFromServer: this._fetchedFromServer,
      previousPage: this.previousPage,
    });
  }

  _onChildCreated({ topicId, post, parentPostNumber }) {
    if (
      String(topicId) !== String(this.args.topic?.id) ||
      parentPostNumber !== this.args.parentPostNumber
    ) {
      return;
    }

    const alreadyExists = this._includesPost(this.childNodes, post);
    if (alreadyExists) {
      return;
    }
    if (this.flatReplies && this.hasMore) {
      return;
    }

    this.childNodes = this.flatReplies
      ? this.#mergeNodes([{ post, children: [] }])
      : [{ post, children: [] }, ...this.childNodes];

    this._reportToCache();
  }

  _childrenForTopic(children, topicId) {
    return (children || []).filter(
      (child) =>
        child.topic_id != null && String(child.topic_id) === String(topicId)
    );
  }

  _processNode(nodeData) {
    return processNode(this.store, this.args.topic, nodeData);
  }

  _includesPost(nodes, post) {
    return nodes.some(
      (node) =>
        node.post.id === post.id || node.post.post_number === post.post_number
    );
  }


}

class NestedPost extends Component {

  expanded;
  lineHighlighted = false;
  collapsed;
  showDeletedContent = false;
  showIgnoredContent = false;
  loadingIgnoredContent = false;
  loadingReplies = false;
  restoreScroll = modifier((element) => {
    const anchor = this.args.scrollAnchor;
    if (anchor?.postNumber !== this.args.post.post_number) {
      return;
    }

    const anchorKey = [
      anchor.postNumber,
      anchor.scrollY ?? "",
      anchor.offsetFromTop ?? "",
    ].join(":");
    if (anchorKey === this.#restoredScrollAnchorKey) {
      return;
    }
    this.#restoredScrollAnchorKey = anchorKey;

    if (Number.isFinite(anchor.scrollY)) {
      window.scrollTo(0, anchor.scrollY);
    } else {
      const rect = element.getBoundingClientRect();
      window.scrollTo(0, window.scrollY + rect.top - anchor.offsetFromTop);
    }

    // Defer the event to avoid backtracking re-render errors during the render phase
    Promise.resolve().then(() => {
      this.appEvents.trigger("nested-replies:scroll-restored");
    });
  });
  #restoredScrollAnchorKey = null;

  #postRegistered = false;
  #postRegistrationTimer;

  _childWasCreated = false;

  constructor() {
    super(...arguments);

    const cached = this.args.expansionState?.get(this.args.post.post_number);
    if (cached !== undefined) {
      this.expanded = cached.expanded;
      this.collapsed = cached.collapsed;
    } else {
      const wouldExpand =
        (this.flatReplies
          ? this.args.post.target_post_number > this.args.post.post_number
          : (this.args.children?.length ?? 0) > 0) ||
        this.args.post.deleted_post_placeholder === true ||
        this.args.post.ignored_post_placeholder === true;

      // collapseFromDepth is the URL-driven cutoff (set by the parent view —
      // 0 for root view, 1 for context view). At/below it, the post renders
      // but its children start hidden behind an "Expand X replies" button.
      if (
        !this.flatReplies &&
        this.args.collapseFromDepth != null &&
        this.args.depth >= this.args.collapseFromDepth
      ) {
        this.expanded = false;
      } else {
        this.expanded = wouldExpand;
      }
      this.collapsed = false;
    }

    this.appEvents.on(
      "nested-replies:child-created",
      this,
      this._onChildCreated
    );
    this.#postRegistrationTimer = scheduleOnce(
      "afterRender",
      this,
      this.#registerPost
    );
  }

  willDestroy() {
    super.willDestroy(...arguments);
    cancel(this.#postRegistrationTimer);
    this.appEvents.off(
      "nested-replies:child-created",
      this,
      this._onChildCreated
    );

    if (this.#postRegistered) {
      this.appEvents.trigger(
        "nested-replies:post-unregistered",
        this.args.post
      );
    }
  }

  get isRoot() {

  get flatReplies() {

  get renderChildren() {

      !this.effectiveCollapsed &&
      !this.atMaxDepth &&
      (this.effectiveExpanded || (this.flatReplies && this.hasReplies))
    );
  }

  get previewChildren() {

  }

  get cloakingData() {

      return { active: false };

      above: this.args.cloakAbove,
      below: this.args.cloakBelow,
    });
  }

  get depthClass() {
    return `--depth-${this.args.depth}`;
  }

  get isMobile() {
    return this.site.mobileView;
  }

  get canCreatePost() {
    return this.currentUser && this.args.topic?.details?.can_create_post;
  }

  get hasReplies() {
    return (
      this._childWasCreated ||
      (this.args.post.direct_reply_count || 0) > 0 ||
      (this.args.children?.length ?? 0) > 0
    );
  }

  get replyCount() {
    const count =
      this.args.post.total_descendant_count ||
      this.args.post.direct_reply_count ||
      this.args.children?.length ||

  get atMaxDepth() {

  get isIgnoredPlaceholder() {

  }

  get renderIgnoredPlaceholder() {
    return this.isIgnoredPlaceholder && !this.showIgnoredContent;
  }

  get showContinueThread() {
    return (
      this.atMaxDepth &&
      this.hasReplies &&
      !this.siteSettings.nested_replies_cap_nesting_depth
    );
  }

  get showDepthLine() {
    return (
      !this.flatReplies &&
      (!this.hasReplies || !this.atMaxDepth || this.showContinueThread)
    );
  }

  get depthLineCollapsed() {
    return this.hasReplies && !this.expanded;
  }

  get showDepthLineIcon() {
    return !this.hasReplies || this.expanded;
  }

  get showExpandRepliesButton() {
    return (
      !this.flatReplies &&
      this.hasReplies &&
      !this.effectiveExpanded &&
      !this.atMaxDepth
    );
  }

  get childPath() {
    return [
      ...(this.args.path || []),
      { post: this.args.post, children: this.args.children || [] },
    ];
  }

  get mobileFocusEnabled() {
    return !this.flatReplies && this.site.mobileView && this.args.focusPost;
  }

  get childDepth() {
    return this.args.depth + 1;
  }

  get effectiveExpanded() {
    return this.args.forceExpanded || this.expanded;
  }

  get effectiveCollapsed() {
    return !this.args.forceExpanded && this.collapsed;
  }

  get isOP() {
    return this.args.post.user_id === this.args.topic?.user_id;
  }

  get selected() {

  get contextUrl() {

  }

  get expandLabel() {

  get collapsedBarLabel() {

  childPathWithNewChild(childPost) {
    const children = this.args.children || [];
    const hasChild = children.some(

        node.post?.id === childPost?.id ||
        node.post?.post_number === childPost?.post_number

      ...(this.args.path || []),

  toggleExpanded() {

        expanded: this.expanded,
        collapsed: false,
      });
      return;
    }

    if (!this.hasReplies) {
      this.collapsed = !this.collapsed;
      this.lineHighlighted = false;
      this.args.expansionState?.set(this.args.post.post_number, {
        expanded: this.expanded,
        collapsed: this.collapsed,
      });
      return;
    }

    if (this.expanded) {
      this.expanded = false;
      this.collapsed = true;

    } else {
      this.expanded = true;
      this.collapsed = false;

      collapsed: this.collapsed,
    });

  collapsePost() {
    if (this.hasReplies) {

    this.lineHighlighted = false;

      collapsed: this.collapsed,

  async childrenForMobileFocus() {

      this.args.topic?.id,
      this.args.post.post_number,
      this.args.sort,
    ].join(":");
    const cached = this.args.fetchedChildrenCache?.get(cacheKey);
    if (cached) {
      return cached.childNodes;
    }

    if ((this.args.children?.length ?? 0) > 0 || !this.hasReplies) {
      return this.args.children || [];
    }

    this.loadingReplies = true;

      const query = new URLSearchParams({
        sort: this.args.sort || "top",
        depth: this.childDepth,
      });
      const data = await ajax(
        `/n/${this.args.topic.slug}/${this.args.topic.id}/children/${this.args.post.post_number}.json?${query}`
      );
      if (
        this.isDestroying ||
        this.childCacheKey !== cacheKey ||
        [this.args.topic?.id, this.args.post.post_number, this.args.sort].join(
          ":"
        ) !== identityKey
      ) {
        return null;
      }

      const childNodes = (data.children || [])
        .filter(
          (child) =>
            child.topic_id != null &&
            String(child.topic_id) === String(this.args.topic?.id)
        )
        .map((child) => processNode(this.store, this.args.topic, child));
      this.args.fetchedChildrenCache?.set(cacheKey, {
        childNodes,
        page: data.page,
        hasMore: data.has_more || false,
        fetchedFromServer: true,
      });
      return childNodes;
    } catch (e) {
      if (!this.isDestroying) {
        popupAjaxError(e);
      }
      return null;
    } finally {
      if (!this.isDestroying) {
        this.loadingReplies = false;
      }
    }
  }

  async handleReplies() {
    if (this.loadingReplies) {
      return;
    }

    if (this.mobileFocusEnabled) {
      const returnAnchor = this.args.captureScrollAnchor?.();
      const children = await this.childrenForMobileFocus();
      if (children && !this.isDestroying) {
        this.args.focusPost(this.childPathWithChildren(children), returnAnchor);
      }
      return;
    }

    this.toggleExpanded();
  }

  handleDepthLine() {
    if (this.site.mobileView && !this.args.forceExpanded) {
      this.collapsePost();
      return;
    }

    this.toggleExpanded();
  }

  toggleDeletedContent() {
    this.showDeletedContent = !this.showDeletedContent;
  }

  async revealIgnoredContent() {
    if (this.showIgnoredContent || this.loadingIgnoredContent) {
      return;
    }

    }
  }

  highlightLine() {
    if (!this.site.mobileView) {
      this.lineHighlighted = true;
    }
  }

  unhighlightLine() {
    this.lineHighlighted = false;
  }

  copyLink() {

  togglePostSelection() {

  }

  }

  selectBelow() {

  }

    if (
      String(topicId) !== String(this.args.topic?.id) ||
      parentPostNumber !== this.args.post.post_number
    ) {
      return;
    }

    const post = this.args.post;
    post.set("direct_reply_count", (post.direct_reply_count || 0) + 1);
    post.set("total_descendant_count", (post.total_descendant_count || 0) + 1);
    this._childWasCreated = true;

    if (!this.expanded && (!this.flatReplies || isOwnPost)) {
      this.expanded = true;
      this.collapsed = false;
      this.args.expansionState?.set(this.args.post.post_number, {
        expanded: true,
        collapsed: false,
      });
    }

    if (isOwnPost && this.mobileFocusEnabled) {
      this.args.focusPost(this.childPathWithNewChild(childPost));
    }
  }


}

class ISBFReplyContext extends Component {

  expanded = false;
  loading = false;
  parent = null;
  unavailable = false;

  get label() {
    const user = this.args.post.reply_to_user;
    const identity = displayIdentity({
      ...user,
      name: this.siteSettings.enable_names ? user?.name : null,
    });
    return i18n(themePrefix("isbf_v2.reply_conversations.reply_to"), {
      name:
        identity ||
        i18n(themePrefix("isbf_v2.reply_conversations.original_post")),
      number: this.args.post.reply_to_post_number,
    });
  }

  get parentUrl() {
    return getURL(
      `${this.args.post.topic.url}/${this.args.post.reply_to_post_number}`
    );
  }

  async toggle() {
    if (this.loading) {
      return;
    }
    this.expanded = !this.expanded;
    if (!this.expanded || this.parent) {
      return;
    }
    this.loading = true;
    this.unavailable = false;
    const post = this.args.post;
    try {
      const data = await ajax(
        `/posts/by_number/${post.topic.id}/${post.reply_to_post_number}.json`
      );
      if (this.isDestroying || this.args.post !== post) {
        return;
      }
      if (
        data.deleted_at ||
        data.deleted_post_placeholder ||
        data.cooked_hidden ||
        !data.cooked
      ) {
        this.unavailable = true;
      } else {
        this.parent = this.store.createRecord("post", {
          ...data,
          topic: post.topic,
        });
        this.a11y.announce(
          i18n(themePrefix("isbf_v2.reply_conversations.context_loaded")),
          "polite"
        );
      }
    } catch {
      if (!this.isDestroying && this.args.post === post) {
        this.unavailable = true;
      }
    } finally {
      if (!this.isDestroying) {
        this.loading = false;
      }
    }
  }

  retry() {
    this.expanded = false;
    return this.toggle();
  }


}

class ReplyNavigation {
  currentIndex = 1;
  lastReadIndex = 0;
  metadata;

  #appEvents;
  #entries = new Map();
  #generation = 0;
  #topic;
  #destroyed = false;

  constructor(topic, appEvents) {
    this.#topic = topic;
    this.#appEvents = appEvents;
    this.metadata = topic.reply_navigation || { root_count: 0, reply_count: 0 };
    this.currentIndex = this.metadata.root_index || 1;
    for (const post of topic.postStream.posts) {
      if (post.root_index) {
        this.#entries.set(post.root_index, {
          root_post_number: post.post_number,
          root_created_at: post.created_at,
        });
      }
    }
    if (topic.last_read_post_number > 1) {
      this.#fetch({ post_number: topic.last_read_post_number })
        .then((data) => {
          if (!this.#destroyed) {
            this.lastReadIndex = data.root_index;
            this.notify();
          }
        })
        .catch(() => {});
    }
  }

  get total() {
    return (this.#topic.reply_navigation || this.metadata).root_count;
  }

  get loadedAllPosts() {
    return true;
  }

  dateForIndex(index) {
    const date =
      this.#entries.get(index)?.root_created_at ||
      this.#topic.postStream.posts.find((post) => post.root_index === index)
        ?.created_at;
    return date ? new Date(date) : null;
  }

  destroy() {
    this.#destroyed = true;
    this.#generation++;
  }

  excerpt() {
    return Promise.resolve(null);
  }

  label(index = this.currentIndex) {
    return i18n(themePrefix("isbf_v2.reply_conversations.progress"), {
      current: Math.min(index, this.total),
      total: this.total,
    });
  }

  notify(index = this.currentIndex) {
    this.currentIndex = index;
    this.#appEvents.trigger("topic:group-scrolled", {
      postIndex: index,
      percent: index >= this.total ? 1 : (index - 1) / Math.max(this.total, 1),
    });
  }

  async jumpToIndex(index) {
    const generation = ++this.#generation;
    const data = await this.#fetch({ root_index: index });
    if (this.#destroyed || generation !== this.#generation) {
      return;
    }
    this.jumpToPostNumber(data.root_post_number);
  }

  jumpToPostNumber(postNumber) {
    if (postNumber && !this.#destroyed) {
      DiscourseURL.routeTo(`${this.#topic.url}/${postNumber}`);
    }
  }

  async #fetch(query) {
    const data = await ajax(
      `/n/${this.#topic.slug}/${this.#topic.id}/navigation.json`,
      { data: query }
    );
    if (!this.#destroyed) {
      this.#entries.set(data.root_index, data);
    }
    return data;
  }
}

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;

}
function button(className, label, action) {

  node.type = "button";
  node.addEventListener("click", async () => { const result = action(); render(); await result; render(); });
  return node;
}
function contextNode(item) {
  if (!contexts.has(item.post_number)) contexts.set(item.post_number, new ISBFReplyContext({ post: item }));
  const model = contexts.get(item.post_number);
  const wrapper = element("div", "isbf-reply-context");
  const toggle = button("btn-flat isbf-reply-context__toggle", model.label, () => model.toggle());
  toggle.setAttribute("aria-expanded", String(model.expanded));
  wrapper.append(toggle);
  if (model.expanded) {
    const preview = element("div", "isbf-reply-context__preview");
    if (model.loading) preview.append(element("span", "", "正在加载…"));
    else if (model.parent) {
      preview.append(element("div", "cooked", model.parent.cooked));
      const link = element("a", "isbf-reply-context__link", i18n("isbf_v2.reply_conversations.go_to_original"));
      link.href = model.parentUrl;
      link.addEventListener("click", (event) => { event.preventDefault(); DiscourseURL.routeTo(model.parentUrl); });
      preview.append(link);
    } else if (model.unavailable) {
      preview.append(element("p", "", i18n("isbf_v2.reply_conversations.context_unavailable")), button("btn-flat fixture-context-retry", "重试", () => model.retry()));
    }
    wrapper.append(preview);
  }
  return wrapper;
}
function postNode(item, depth = 1, showContext = true) {

  gutter.append(avatar);
  const main = element("div", "nested-post__main");
  const article = element("article", "nested-post__article boxed");
  article.dataset.postNumber = item.post_number;
  const header = element("div", "nested-post__header");
  const metadata = element("div", "isbf-post-card-header");
  const names = element("div", "names");
  const first = element("span", "first");
  const name = element("a", "", item.name); name.href = `#user-${item.username}`; first.append(name); names.append(first);
  metadata.append(names, element("span", "isbf-feed-card__username", `@${item.username}`), element("span", "post-infos post-date", `10月15日 · #${item.post_number}`));
  header.append(metadata);
  if (showContext) header.append(contextNode(item));
  const content = element("div", "nested-post__content regular");
  content.append(element("div", "cooked", item.cooked));
  const menu = element("section", "nested-post__menu post-menu-area");
  const controls = element("nav", "post-controls");
  const actions = element("div", "actions");
  actions.append(button("btn-flat", "♡", () => {}), button("btn-flat", "↪ 回复", () => {}), button("btn-flat", "↗", () => {}));
  controls.append(actions); menu.append(controls);

}
function render() {
  const roots = document.querySelector(".nested-view__roots");
  roots.replaceChildren();
  const outer = postNode(rootPost, 0);
  const list = element("div", "nested-post-children");
  for (const item of children.displayItems) {
    if (item.gap) list.append(button("btn-flat nested-post-children__previous", i18n("nested_replies.load_previous_replies"), () => children.loadPrevious()));
    else list.append(postNode(item.node.post).wrapper);
  }
  if (children.error) list.append(element("p", "nested-post-children__error", i18n("nested_replies.replies_load_error")), button("btn-flat fixture-list-retry", "重试", () => children.retry()));
  if (children.canExpandPreview) list.append(button("btn-flat nested-post-children__expand", children.previewLabel, () => children.expandPreview()));
  else if (children.hasMore && !children.args.preview) list.append(button("btn-flat nested-post-children__load-more", children.loadMoreLabel, () => children.loadMore()));
  if (!children.args.preview) list.append(button("btn-flat nested-post-children__collapse", i18n("nested_replies.collapse"), () => children.args.toggleReplies()));
  outer.main.append(list); roots.append(outer.wrapper);
  roots.append(postNode({ ...post(103, 1), cooked: "志愿者报名表已经整理好了，周末有空的同学可以一起参与。" }, 0, false).wrapper);
  document.querySelector(".isbf-topic-reading__toggle").textContent = navigation.label();
  document.querySelector(".timeline-replies").textContent = navigation.label();
}
document.querySelector(".isbf-topic-reading__toggle").addEventListener("click", () => {
  const panel = document.querySelector(".topic-navigation");
  panel.classList.toggle("topic-progress-expanded");
  document.querySelector(".isbf-topic-reading__toggle").setAttribute("aria-expanded", String(panel.classList.contains("topic-progress-expanded")));

document.querySelector(".isbf-topic-reading__close").addEventListener("click", () => document.querySelector(".topic-navigation").classList.remove("topic-progress-expanded"));
