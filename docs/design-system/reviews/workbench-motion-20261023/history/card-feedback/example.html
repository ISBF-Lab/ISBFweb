<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="工作台独立交互预览；本地示例数据，点击仅演示反馈，不访问线上服务。">
  <title>工作台 · 三列与动效预览 · 本地示例数据</title>
  <style>:root {
  color-scheme: light;
  --primary: #17202a;
  --secondary: #fff;
  --tertiary: #1769aa;
  --primary-medium: #5d6872;
  --primary-low: #e4e8eb;
  --primary-very-low: #f4f6f8;
  --font-family:
    system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
  --isbf-v2-text: var(--primary);
  --isbf-v2-background: var(--secondary);
  --isbf-v2-surface: var(--secondary);
  --isbf-v2-muted: var(--primary-medium);
  --isbf-v2-border: var(--primary-low);
  --isbf-v2-hover: var(--primary-very-low);
  --isbf-v2-active-surface: var(--primary-very-low);
  --isbf-v2-accent: var(--tertiary);
  --isbf-v2-accent-contrast: var(--secondary);
  --isbf-v2-focus-ring: color-mix(
    in srgb,
    var(--isbf-v2-accent) 65%,
    var(--isbf-v2-text)
  );
  --isbf-v2-font-family: var(--font-family);
  --isbf-v2-font-xs: 13px;
  --isbf-v2-font-sm: 15px;
  --isbf-v2-font-md: 16px;
  --isbf-v2-font-lg: 18px;
  --isbf-v2-font-xl: 20px;
  --isbf-v2-weight-medium: 600;
  --isbf-v2-weight-bold: 750;
  --isbf-v2-space-1: 4px;
  --isbf-v2-space-2: 8px;
  --isbf-v2-space-3: 12px;
  --isbf-v2-space-4: 16px;
  --isbf-v2-space-5: 20px;
  --isbf-v2-space-6: 24px;
  --isbf-v2-space-8: 32px;
  --isbf-v2-radius-sm: 8px;
  --isbf-v2-radius-md: 16px;
  --isbf-v2-radius-pill: 999px;
  --isbf-v2-transition-fast: 120ms ease;
  --isbf-v2-left-width: 260px;
  --isbf-v2-gap: 24px;
  --isbf-v2-layout-max: 1260px;
  --isbf-v2-page-left: max(16px, calc((100vw - var(--isbf-v2-layout-max)) / 2));
  --isbf-v2-feed-left: calc(
    var(--isbf-v2-page-left) + var(--isbf-v2-left-width) + var(--isbf-v2-gap)
  );
  --isbf-v2-feature-width: min(
    920px,
    calc(100vw - var(--isbf-v2-feed-left) - 24px)
  );
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --primary: #e7e9ea;
  --secondary: #101413;
  --tertiary: #72c5fa;
  --primary-medium: #adb5b8;
  --primary-low: #303735;
  --primary-very-low: #1a201e;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--isbf-v2-background);
  color: var(--isbf-v2-text);
  font-family: var(--isbf-v2-font-family);
  font-size: var(--isbf-v2-font-md);
  line-height: 1.5;
}
a {
  color: inherit;
  text-decoration: none;
}
button,
summary {
  font: inherit;
}
button,
a,
summary {
  -webkit-tap-highlight-color: transparent;
}
a:focus-visible,
button:focus-visible,
summary:focus-visible {
  outline: 2px solid var(--isbf-v2-focus-ring);
  outline-offset: 3px;
}
button {
  cursor: pointer;
}
.d-icon {
  display: inline-block;
  width: 1em;
  height: 1em;
  flex: none;
  fill: currentcolor;
  vertical-align: -0.125em;
}
.isbf-icons {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}
.isbf-skip {
  position: fixed;
  top: -100px;
  left: 16px;
  z-index: 100;
  padding: 12px 16px;
  background: var(--isbf-v2-surface);
}
.isbf-skip:focus {
  top: 12px;
}
.isbf-v2-side {
  position: fixed;
  top: 0;
  left: var(--isbf-v2-page-left);
  display: flex;
  flex-direction: column;
  width: var(--isbf-v2-left-width);
  height: 100dvh;
  padding: 8px 12px 16px 0;
}
.isbf-v2-brand {
  display: flex;
  align-items: center;
  width: fit-content;
  max-width: 100%;
  min-height: 56px;
  margin-bottom: 12px;
  padding: 0 12px;
  border-radius: var(--isbf-v2-radius-pill);
  font-size: var(--isbf-v2-font-lg);
  font-weight: 800;
}
.isbf-v2-brand__compact {
  display: none;
}
.isbf-v2-side__links {
  display: grid;
  gap: 4px;
  justify-items: start;
}
.isbf-v2-side__links > a,
.isbf-v2-more > summary {
  display: flex;
  align-items: center;
  gap: 18px;
  width: fit-content;
  min-height: 52px;
  padding: 0 16px;
  border-radius: var(--isbf-v2-radius-pill);
  font-size: var(--isbf-v2-font-xl);
}
.isbf-v2-side__links .d-icon,
.isbf-v2-more > summary .d-icon {
  width: 26px;
  height: 26px;
}
.isbf-v2-side__links .is-active {
  background: var(--isbf-v2-active-surface);
  font-weight: var(--isbf-v2-weight-bold);
}
.isbf-v2-side__compose {
  display: grid;
  place-items: center;
  width: calc(100% - 20px);
  min-height: 52px;
  margin-top: 18px;
  border-radius: var(--isbf-v2-radius-pill);
  background: var(--isbf-v2-accent);
  color: var(--isbf-v2-accent-contrast);
  font-size: 17px;
  font-weight: var(--isbf-v2-weight-bold);
}
.isbf-v2-side__plus {
  display: none;
}
.isbf-v2-side__login {
  display: flex;
  align-items: center;
  gap: var(--isbf-v2-space-3);
  width: fit-content;
  min-height: 52px;
  margin-top: auto;
  padding: 0 16px;
  border-radius: var(--isbf-v2-radius-pill);
  color: var(--isbf-v2-muted);
  font-size: var(--isbf-v2-font-sm);
}
.isbf-v2-side__login .d-icon {
  width: 20px;
  height: 20px;
}
.isbf-v2-more {
  position: relative;
}
.isbf-v2-more > summary {
  list-style: none;
  cursor: pointer;
}
.isbf-v2-more > summary::-webkit-details-marker {
  display: none;
}
.isbf-v2-more__content {
  position: absolute;
  z-index: 60;
  top: calc(100% + 8px);
  left: 0;
  width: 220px;
  padding: 8px;
  border: 1px solid var(--isbf-v2-border);
  border-radius: var(--isbf-v2-radius-md);
  background: var(--isbf-v2-surface);
  box-shadow: 0 8px 28px rgb(0 0 0 / 22%);
}
.isbf-v2-more__content > a,
.isbf-v2-more__content > button {
  display: flex;
  align-items: center;
  gap: var(--isbf-v2-space-3);
  width: 100%;
  min-height: 48px;
  padding: 0 12px;
  border: 0;
  border-radius: var(--isbf-v2-radius-sm);
  background: transparent;
  color: var(--isbf-v2-text);
  font-size: var(--isbf-v2-font-sm);
  text-align: left;
}
.isbf-v2-more__content .d-icon {
  width: 16px;
  height: 16px;
}

.isbf-v2-mobile-nav {
  display: none;
}
@media (hover: hover) {
.isbf-v2-brand:hover,
  .isbf-v2-side__links > a:hover,
  .isbf-v2-more > summary:hover,
  .isbf-v2-more__content > a:hover,
  .isbf-v2-more__content > button:hover,
  .isbf-v2-side__login:hover {
    background: var(--isbf-v2-hover);
  }
.isbf-v2-side__compose:hover {
    filter: brightness(0.92);
  }
}
@media (width <= 1279px) {
:root {
    --isbf-v2-left-width: 220px;
    --isbf-v2-page-left: max(16px, calc((100vw - 844px) / 2));
  }
}
@media (width <= 1023px) {
:root {
    --isbf-v2-left-width: 72px;
    --isbf-v2-gap: 8px;
    --isbf-v2-page-left: max(
      8px,
      calc((100vw - 72px - 8px - min(600px, 100vw - 100px)) / 2)
    );
  }
.isbf-v2-side {
    padding-inline-end: 0;
  }
.isbf-v2-brand,
  .isbf-v2-side__links > a,
  .isbf-v2-more > summary {
    justify-content: center;
    width: 56px;
    padding-inline: 0;
  }
.isbf-v2-brand__name,
  .isbf-v2-side__links > a > span,
  .isbf-v2-side__links .isbf-v2-more > summary > span,
  .isbf-v2-side__compose > span:first-child,
  .isbf-v2-side__login > span {
    display: none;
  }
.isbf-v2-brand__compact {
    display: block;
    font-size: var(--isbf-v2-font-xs);
  }
.isbf-v2-side__compose {
    width: 52px;
    height: 52px;
  }
.isbf-v2-side__plus {
    display: inline;
    font-size: 26px;
  }
}
@media (width <= 600px) {
:root {
    --isbf-v2-feature-width: 100%;
    --isbf-v2-feed-left: 0px;
  }
.isbf-v2-side {
    display: none;
  }
.isbf-v2-mobile-nav {
    position: fixed;
    z-index: 50;
    inset: auto 0 0;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    height: calc(64px + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    border-top: 1px solid var(--isbf-v2-border);
    background: var(--isbf-v2-background);
  }
.isbf-v2-mobile-nav a {
    display: grid;
    align-content: center;
    justify-items: center;
    gap: 4px;
    min-width: 44px;
    min-height: 44px;
    font-size: 10px;
  }
.isbf-v2-mobile-nav .d-icon {
    width: 23px;
    height: 23px;
  }
.isbf-v2-mobile-nav .is-active {
    color: var(--isbf-v2-accent);
    font-weight: var(--isbf-v2-weight-bold);
  }
}
@media (prefers-reduced-motion: reduce) {
*,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}
.isbf-v2-workbench {
  --workbench-row-height: clamp(144px, calc((100dvh - 228px) / 3), 208px);

  width: var(--isbf-v2-feature-width);
  min-height: 100dvh;
  margin-inline-start: var(--isbf-v2-feed-left);
  padding: 32px 26px 80px;
  border-inline: 1px solid var(--isbf-v2-border);
  background: var(--isbf-v2-surface);
  outline: none;
}

.isbf-v2-workbench h1 {
  margin: 0;
  font-size: clamp(28px, 3vw, 34px);
  font-weight: 700;
  line-height: 1.25;
}

.isbf-v2-workbench__panel {
  margin-top: var(--isbf-v2-space-6);
  padding: 24px;
  border: 1px solid var(--isbf-v2-border);
  border-radius: 22px;
  background: var(--isbf-v2-hover);
}

.isbf-v2-workbench__grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-auto-rows: minmax(var(--workbench-row-height), auto);
  gap: 14px;
}

.isbf-v2-workbench__card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 0;
  padding: 16px 8px;
  border: 1px solid var(--isbf-v2-border);
  border-radius: 18px;
  background: var(--isbf-v2-surface);
  text-align: center;
}

.isbf-v2-workbench__icon {
  display: grid;
  width: 62px;
  height: 62px;
  flex-shrink: 0;
  place-items: center;
  border-radius: 18px;
  background: color-mix(
    in srgb,
    var(--isbf-v2-accent) 15%,
    var(--isbf-v2-surface)
  );
  color: var(--isbf-v2-accent);
}

.isbf-v2-workbench__icon .d-icon {
  width: 27px;
  height: 27px;
}

.isbf-v2-workbench__icon--mint,
.isbf-v2-workbench__icon--teal {
  background: color-mix(in srgb, #35b595 19%, var(--isbf-v2-surface));
  color: #239c81;
}

.isbf-v2-workbench__icon--amber,
.isbf-v2-workbench__icon--rose {
  background: color-mix(in srgb, #e5a659 21%, var(--isbf-v2-surface));
  color: #b67b37;
}

.isbf-v2-workbench__icon--violet,
.isbf-v2-workbench__icon--indigo {
  background: color-mix(in srgb, #9480d8 19%, var(--isbf-v2-surface));
  color: #7965ba;
}

.isbf-v2-workbench__name {
  max-width: 100%;
  margin-top: 13px;
  overflow-wrap: anywhere;
  font-size: 15px;
  font-weight: 700;
}

.isbf-v2-workbench a.isbf-v2-workbench__card {
  color: var(--isbf-v2-text);
  transition:
    transform 220ms cubic-bezier(0.2, 0.9, 0.2, 1.12),
    background-color 160ms ease;
}

.isbf-v2-workbench a.isbf-v2-workbench__card:focus-visible {
  outline: 2px solid var(--isbf-v2-focus-ring);
  outline-offset: 2px;
}

.isbf-v2-workbench__ripple-layer {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: inherit;
  pointer-events: none;
}

.isbf-v2-workbench__ripple {
  position: absolute;
  border-radius: 50%;
  background: var(--isbf-v2-accent);
  opacity: 0;
  pointer-events: none;
}

.isbf-v2-workbench__more {
  display: none;
}

:where(html.discourse-no-touch)
  .isbf-v2-workbench
  a.isbf-v2-workbench__card:hover {
  background: var(--isbf-v2-hover);
  transform: translateY(-2px);
  transition-duration: 160ms;
}

.isbf-v2-workbench a.isbf-v2-workbench__card.is-pressed {
  background: var(--isbf-v2-hover);
  transform: scale(0.97);
  transition-duration: 90ms;
  transition-timing-function: ease-out;
}

@media (width <= 600px) {
  .isbf-v2-workbench {
    --workbench-row-height: clamp(
      112px,
      calc((100dvh - 252px - env(safe-area-inset-bottom)) / 3),
      160px
    );

    padding: 24px 16px calc(80px + env(safe-area-inset-bottom));
    border-inline: 0;
  }

  .isbf-v2-workbench__panel {
    padding: 8px;
  }

  .isbf-v2-workbench__grid {
    gap: 8px;
  }

  .isbf-v2-workbench__card {
    padding: 8px 4px;
    border-radius: 8px;
  }

  .isbf-v2-workbench__icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
  }

  .isbf-v2-workbench__icon .d-icon {
    width: 22px;
    height: 22px;
  }

  .isbf-v2-workbench__name {
    margin-top: 8px;
    font-size: 12px;
    line-height: 1.35;
  }

  .isbf-v2-workbench__more {
    display: flex;
    justify-content: flex-end;
    margin-top: 24px;
    margin-inline: -16px;
  }

  .isbf-v2-workbench__more-control {
    width: 25%;
    min-width: 44px;
  }

  .isbf-v2-workbench__more summary {
    display: grid;
    align-content: center;
    justify-items: center;
    gap: 0;
    width: 100%;
    min-height: 44px;
    padding: 0;
    font-size: 10px;
  }

  .isbf-v2-workbench__more summary .d-icon {
    width: 23px;
    height: 23px;
    margin-bottom: 3px;
    transform: translateY(-8px);
  }

  .isbf-v2-workbench__more .isbf-v2-more__content {
    inset: auto 0 calc(100% + 8px) auto;
  }
}

@media (prefers-reduced-motion: reduce) {
  .isbf-v2-workbench a.isbf-v2-workbench__card,
  .isbf-v2-workbench a.isbf-v2-workbench__card:hover,
  .isbf-v2-workbench a.isbf-v2-workbench__card.is-pressed {
    transform: none;
    transition: none;
  }

  .isbf-v2-workbench__ripple-layer {
    display: none;
  }
}

.is-baseline .isbf-v2-workbench__grid {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-auto-rows: auto;
}

.is-baseline .isbf-v2-workbench__card {
  justify-content: flex-start;
  transition: none;
}

.is-baseline .isbf-v2-workbench a.isbf-v2-workbench__card:hover {
  transform: none;
}

@media (601px <= width <= 1099px) {
  .is-baseline .isbf-v2-workbench__grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (width <= 600px) {
  .is-baseline .isbf-v2-workbench {
    display: flex;
    flex-direction: column;
  }

  .is-baseline .isbf-v2-workbench__panel {
    flex-shrink: 0;
  }

  .is-baseline .isbf-v2-workbench__more {
    margin-top: auto;
    padding-top: 24px;
  }
}
</style>
</head>

  <script>(() => {
  const media = window.matchMedia("(prefers-reduced-motion: reduce)");
  const baseline = document.body.classList.contains("is-baseline");
  const animations = new Map();
  let pressedCard;
  let pointerId;

  document.documentElement.classList.toggle(
    "discourse-no-touch",
    window.matchMedia("(hover: hover)").matches ||
      navigator.maxTouchPoints === 0
  );
  document.addEventListener(
    "pointerover",
    (event) => {
      document.documentElement.classList.toggle(
        "discourse-no-touch",
        event.pointerType === "mouse"
      );
    },
    { passive: true }
  );

  function cancelRipple(card) {
    animations.get(card)?.cancel();
    animations.delete(card);
  }

  function ripple(card, clientX, clientY) {
    if (media.matches || baseline) {
      return;
    }

    cancelRipple(card);
    const bounds = card.getBoundingClientRect();
    const x = clientX ?? bounds.left + bounds.width / 2;
    const y = clientY ?? bounds.top + bounds.height / 2;
    const localX = Math.max(0, Math.min(bounds.width, x - bounds.left));
    const localY = Math.max(0, Math.min(bounds.height, y - bounds.top));
    const diameter =
      2 *
      Math.hypot(
        Math.max(localX, bounds.width - localX),
        Math.max(localY, bounds.height - localY)
      );
    const dot = card.querySelector(".isbf-v2-workbench__ripple");
    if (!dot?.animate) {
      return;
    }

    dot.style.width = `${diameter}px`;
    dot.style.height = `${diameter}px`;
    dot.style.left = `${localX - diameter / 2}px`;
    dot.style.top = `${localY - diameter / 2}px`;
    const animation = dot.animate(
      [
        { transform: "scale(0)", opacity: 0.12 },
        { transform: "scale(1)", opacity: 0 },
      ],
      { duration: 420, easing: "cubic-bezier(0.2, 0.7, 0.2, 1)" }
    );
    animations.set(card, animation);
    animation.onfinish = () => {
      if (animations.get(card) === animation) {
        animations.delete(card);
      }
    };
  }

  function release(cancel = false) {
    if (pressedCard) {
      pressedCard.classList.remove("is-pressed");
      if (cancel) {
        cancelRipple(pressedCard);
      }
    }
    pressedCard = undefined;
    pointerId = undefined;
  }

  document.querySelectorAll("a.isbf-v2-workbench__card").forEach((card) => {
    if (baseline) {
      return;
    }

    card.addEventListener(
      "pointerdown",
      (event) => {
        if (!event.isPrimary || event.button !== 0) {
          return;
        }
        release(true);
        pressedCard = card;
        pointerId = event.pointerId;
        card.classList.add("is-pressed");
        ripple(card, event.clientX, event.clientY);
      },
      { passive: true }
    );

    card.addEventListener("pointerleave", () => {
      if (pressedCard === card) {
        release(true);
      }
    });

    card.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.repeat) {
        release(true);
        pressedCard = card;
        card.classList.add("is-pressed");
        ripple(card);
      }
    });

    card.addEventListener("keyup", (event) => {
      if (event.key === "Enter") {
        release();
      }
    });

    card.addEventListener("blur", () => {
      if (pressedCard === card) {
        release(true);
      }
    });
  });

  document.addEventListener(
    "pointerup",
    (event) => {
      if (event.pointerId === pointerId) {
        release();
      }
    },
    { passive: true }
  );
  document.addEventListener(
    "pointercancel",
    (event) => {
      if (event.pointerId === pointerId) {
        release(true);
      }
    },
    { passive: true }
  );
  window.addEventListener("blur", () => release(true));

  const stop = () => {
    release(true);
    animations.forEach((animation) => animation.cancel());
    animations.clear();
  };
  media.addEventListener("change", stop);
  window.addEventListener("pagehide", stop);

  const menus = [...document.querySelectorAll("details")];
  function closeMenus(except) {
    menus.forEach((menu) => {
      if (menu !== except) {
        menu.open = false;
      }
    });
  }
  menus.forEach((menu) =>
    menu.addEventListener("toggle", () => {
      if (menu.open) {
        closeMenus(menu);
      }
    })
  );
  document.addEventListener("click", (event) => {
    if (!event.target.closest("details")) {
      closeMenus();
    }
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      const open = menus.find((menu) => menu.open);
      closeMenus();
      open?.querySelector("summary").focus();
    }
  });

  document.querySelectorAll(".isbf-v2-more__theme").forEach((button) => {
    button.setAttribute(
      "aria-pressed",
      String(document.documentElement.dataset.theme === "dark")
    );
    button.addEventListener("click", () => {
      const dark = document.documentElement.dataset.theme !== "dark";
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document
        .querySelectorAll(".isbf-v2-more__theme")
        .forEach((toggle) => toggle.setAttribute("aria-pressed", String(dark)));
      closeMenus();
    });
  });

  if (new URLSearchParams(location.search).get("alumni") === "off") {
    document.querySelector('[data-service="alumni"]')?.remove();
  }
})();
</script>
</body>
</html>
